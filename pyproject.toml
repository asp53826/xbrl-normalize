[project]
name = "xbrl-normalize"
version = "0.1.0"
description = "Normalize SEC XBRL company facts into comparable financial statements"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.scripts]
xbrl-normalize = "xbrl_normalize.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xbrl_normalize"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
